<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="أمك صاحبتي">
    <title>أمك صاحبتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, #f5f1ed 0%, #faf8f5 100%);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            color: #3d2817;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 60px;
            animation: slideUp 0.8s ease-out;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 40px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.2s forwards;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .title {
            font-family: 'Aref Ruqaa Ink', serif;
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 700;
            color: #3d2817;
            line-height: 1.2;
            letter-spacing: -2px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.8s ease-out 0.1s backwards;
            word-spacing: 0.1em;
        }

        .accent-line {
            display: inline-block;
            width: 120px;
            height: 4px;
            background: #D8563D;
            margin: 0 auto 40px;
            border-radius: 2px;
            opacity: 0;
            animation: scaleIn 0.6s ease-out 0.4s forwards;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #6b5344;
            font-weight: 500;
            margin-bottom: 50px;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.5s forwards;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 40px;
            background: #D8563D;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            border: 2px solid #D8563D;
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.6s forwards;
            box-shadow: 0 4px 12px rgba(216, 86, 61, 0.2);
        }

        .cta-button:hover {
            background: #c1472f;
            border-color: #c1472f;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(216, 86, 61, 0.3);
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        /* Decorative elements */
        .decoration {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
        }

        .decoration-1 {
            top: 10%;
            right: 5%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #D8563D 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .decoration-2 {
            bottom: 15%;
            left: 5%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #8b7355 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite 1s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scaleX(0);
            }
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            .title {
                margin-bottom: 20px;
            }

            .accent-line {
                width: 80px;
                margin-bottom: 30px;
            }

            .subtitle {
                margin-bottom: 35px;
                font-size: 1rem;
            }

            .cta-button {
                padding: 14px 32px;
                font-size: 1rem;
            }

            .decoration-1 {
                width: 120px;
                height: 120px;
            }

            .decoration-2 {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .title {
                letter-spacing: -1px;
            }

            .accent-line {
                width: 60px;
            }

            .cta-button {
                padding: 12px 28px;
                font-size: 0.95rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #2a2420 0%, #1f1b18 100%);
                color: #f5f1ed;
            }

            .title {
                color: #f5f1ed;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            }

            .subtitle {
                color: #d4c5b9;
            }
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div class="container">
        <div class="header">
            <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Olive circle (incomplete) -->
                <circle cx="50" cy="50" r="35" fill="none" stroke="#8b7355" stroke-width="3" stroke-dasharray="160 220" transform="rotate(-45 50 50)"/>
                
                <!-- Coral handwritten line -->
                <path d="M 30 50 Q 50 30, 70 50 Q 60 65, 40 60" fill="none" stroke="#D8563D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- Saffron dot -->
                <circle cx="50" cy="65" r="3" fill="#d4a574"/>
            </svg>

            <h1 class="title">أمك صاحبتي</h1>
            
            <div class="accent-line"></div>
            
            <p class="subtitle">مساحة دافئة للصحبة التي تبدأ من البيت</p>
        </div>

        <button class="cta-button" onclick="handleClick()">ابدأ الحكاية</button>
    </div>

    <script>
        function handleClick() {
            // Simple interaction feedback
            const button = event.target;
            button.style.transform = 'scale(0.97)';
            setTimeout(() => {
                button.style.transform = '';
            }, 150);
            
            // You can add more functionality here later
            console.log('أمك صاحبتي - الحكاية بدأت');
        }

        // Optional: Add smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
    </script>
</body>
</html>
